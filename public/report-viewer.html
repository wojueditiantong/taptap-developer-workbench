<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <title>TapTap 经营分析报告</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./insights.css">
  <link rel="stylesheet" href="./report-viewer.css">
</head>
<body>
  <header class="report-viewer-bar">
    <div class="report-viewer-title"><span class="brand-seal">T</span><div><strong>TapTap 经营分析报告</strong><small id="reportCreatedAt">正在读取已保存的报告…</small></div></div>
    <div class="report-viewer-actions"><button id="printReport" class="button primary" type="button">打印 / 保存 PDF</button><button id="closeReport" class="button ghost" type="button">关闭</button></div>
  </header>
  <main id="reportDocument" class="report-document"><div class="loading-block"><span class="spinner"></span><p>正在整理图文报告…</p></div></main>
  <script src="./report-viewer.js" type="module"></script>
</body>
</html>
